name: Reusable - Deploy Cloud Function (with REDIS)

on:
  workflow_call:
    inputs:
      # Pool de DB por instancia: conexoes e segundos ate fechar ociosa.
      # APIs que geram arquivo/relatorio podem subir esses valores.
      dbConnLimit:
        required: false
        type: string
        default: "2"
      dbIdleTimeout:
        required: false
        type: string
        default: "60"
      nomeDaFuncao:
        required: true
        type: string
      projeto:
        required: true
        type: string
      bancoSuffix:
        required: false
        type: string
        default: school_1
      cpu:
        required: false
        type: string
        # piso de 1 vCPU aplicado no step de deploy; valores maiores passam
        default: "1"
      concurrency:
        required: false
        type: string
        default: ""
      maxInstances:
        required: false
        type: string
        default: "3"
      # Nomes de secrets adicionais (separados por espaço) buscados no Secret
      # Manager com o prefixo do ambiente (ex: INTERNAL_API_SECRET ->
      # DEV_INTERNAL_API_SECRET no dev). Busca tolerante: secret ausente vira
      # warning, não quebra o deploy de APIs que não usam essas variáveis.
      extraSecrets:
        required: false
        type: string
        default: ""
      # Nomes de Cloud Scheduler jobs (separados por espaço) que chamam rotas
      # desta function protegidas por x-internal-secret. Após o deploy, o
      # header é (re)aplicado com o valor de <ENV>INTERNAL_API_SECRET. Jobs que
      # não existem no ambiente são ignorados com warning (os nomes variam por
      # ambiente, ex.: "revista revistas").
      schedulerJobs:
        required: false
        type: string
        default: ""
      # Build no runner (opt-in). "true": o runner roda `npm ci` + `npm run build`
      # e sobe só o compilado (dist/, package.json e package-lock.json só com as
      # dependências de produção, e firebase.json). O buildpack do Cloud Build passa a fazer apenas a
      # instalação de produção — sem instalar devDependencies, sem `tsc` e sem
      # `npm prune` lá (eram ~140 s dos ~270 s do build). Requisitos da API:
      # `main` apontando para dist/ e nada lido em runtime fora de dist/ além
      # do firebase.json. "false" (padrão): o Cloud Build compila, como sempre.
      prebuild:
        required: false
        type: string
        default: "false"
      # Reaplicar rede (Direct VPC) e Cloud SQL no serviço Cloud Run depois do
      # deploy. "always" (padrão): sempre, criando uma 2ª revisão a cada deploy.
      # "if-needed": só quando a revisão nova não está com a configuração
      # desejada — a revisão do `functions deploy` herda essas anotações da
      # anterior, então no caso comum o update é dispensado.
      vpcUpdate:
        required: false
        type: string
        default: "always"
    secrets:
      FIREBASE_DEV:
        required: false
      FIREBASE_QA:
        required: false
      FIREBASE_SANDBOX:
        required: false
      FIREBASE:
        required: false
      # Leitura dos runners da org para a sonda (opcional — sem ele, ubuntu-latest)
      RUNNERS_READ_TOKEN:
        required: false

concurrency:
  group: pipeline-unica-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:
  # Sonda de runner: o Mac mini (runners self-hosted da org, label macOS) está
  # online e livre? Ocupado -> GitHub na hora; offline -> espera até 2 min e
  # então GitHub (ubuntu-latest).
  #
  # Lê o secret RUNNERS_READ_TOKEN (PAT fine-grained, permissão de org
  # "Self-hosted runners: Read-only" em my-build-ead), repassado pelo caller
  # junto com os FIREBASE_*. Sem o secret (ou vencido) a sonda não enxerga o
  # mini e TODO deploy vai pro GitHub por segurança. O GITHUB_TOKEN não lista
  # runners da org.
  probe:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret RUNNERS_READ_TOKEN ausente — deploy no runner do GitHub."
            echo 'runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Três estados dos runners macOS da org:
          #   idle    -> alguma instância online e livre: deploy no mini.
          #   busy    -> todas online mas ocupadas: fallback IMEDIATO pro GitHub.
          #              Esperar na fila do mini atrasaria mais do que o GitHub;
          #              e a sonda parada custa minuto cobrado.
          #   offline -> nenhuma online (mini desligado/reiniciando): espera até
          #              2 min ele aparecer; senão fallback.
          for i in $(seq 1 8); do  # 8 x 15s = 2 min (só no caso offline)
            STATE=$(gh api orgs/my-build-ead/actions/runners --jq '
              [.runners[] | select(any(.labels[].name; . == "macOS"))]
              | if any(.[]; .status == "online" and .busy == false) then "idle"
                elif any(.[]; .status == "online") then "busy"
                else "offline" end' 2>/dev/null || echo error)
            case "$STATE" in
              idle)
                echo 'runs_on=["self-hosted","macOS","ARM64"]' >> "$GITHUB_OUTPUT"
                echo "Mac mini online e livre — deploy no self-hosted."
                exit 0 ;;
              busy)
                echo 'runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
                echo "Todas as instâncias do Mac mini ocupadas — deploy no runner do GitHub."
                exit 0 ;;
              error)
                echo "::warning::Falha ao consultar os runners da org (token inválido/vencido?) — deploy no runner do GitHub."
                echo 'runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            echo "Mac mini offline (tentativa $i/8)..."
            sleep 15
          done
          echo 'runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          echo "Mac mini não respondeu em 2 min — fallback pro runner do GitHub."

  build_and_deploy:
    # Preferência: Mac mini self-hosted (mac03), com fallback automático pro
    # GitHub via job `probe`. Os passos funcionam nos dois runners: o gcloud
    # vem do setup-gcloud (tool cache do runner) e os scripts de limpeza são
    # bash 3.2/BSD-compatíveis.
    needs: probe
    runs-on: ${{ fromJSON(needs.probe.outputs.runs_on) }}
    permissions:
      contents: read
      id-token: write
    env:
      nomeDaFuncao: ${{ inputs.nomeDaFuncao }}
      projeto: ${{ inputs.projeto }}

    steps:
      # Marca este job como ativo no Mac mini, para o passo final "Limpar _work
      # do projeto" saber se há outro job deste repo rodando na máquina (em
      # outra instância do runner). O marker fica fora do _work, em
      # ~/.actions-runner-jobs/<owner>_<repo>/, compartilhado por todas as
      # instâncias, e guarda o PID do Runner.Worker (pai dos steps) — é por ele
      # que o passo final distingue job vivo de resto de job interrompido.
      - name: Registrar job ativo no runner (self-hosted)
        if: runner.os == 'macOS'
        run: |
          DIR="${HOME}/.actions-runner-jobs/$(printf '%s' "$GITHUB_REPOSITORY" | tr / _)"
          mkdir -p "$DIR"
          MARKER="$DIR/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PPID}"
          printf 'pid=%s\nrunner=%s\nref=%s\nstarted=%s\n' "$PPID" "$RUNNER_NAME" "$GITHUB_REF_NAME" "$(date +%s)" > "$MARKER"
          echo "RUNNER_JOB_MARKER=$MARKER" >> "$GITHUB_ENV"
          echo "Job registrado em $MARKER"

      - name: Checkout
        uses: actions/checkout@v4

      - name: 'auth dev'
        if: github.ref_name == 'dev'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_DEV }}'
          export_default_credentials: true

      - name: 'auth qa'
        if: github.ref_name == 'qa'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_QA }}'
          export_default_credentials: true

      - name: 'auth sandbox'
        if: github.ref_name == 'sandbox'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_SANDBOX }}'
          export_default_credentials: true

      - name: 'auth main'
        if: github.ref_name == 'main'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE }}'
          export_default_credentials: true

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Definir ambiente e projeto
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ENV=" >> $GITHUB_ENV
            echo "ENV_DB=" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "ENV=DEV_" >> $GITHUB_ENV
            echo "ENV_DB=dev_" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "qa" ]]; then
            echo "ENV=QA_" >> $GITHUB_ENV
            echo "ENV_DB=qa_" >> $GITHUB_ENV
          else
            echo "ENV=SANDBOX_" >> $GITHUB_ENV
            echo "ENV_DB=sandbox_" >> $GITHUB_ENV
          fi
          echo "project_id=$(gcloud config get-value project)" >> $GITHUB_OUTPUT

      - name: Acessar segredos do Secret Manager (paralelo)
        id: secret
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          secrets: |-
            DB_MYSQL_STRING:${{ steps.env.outputs.project_id }}/${{ env.ENV }}DB_MYSQL_STRING
            DOMAIN:${{ steps.env.outputs.project_id }}/${{ env.ENV }}DOMAIN
            APIKEY:${{ steps.env.outputs.project_id }}/${{ env.ENV }}APIKEY
            AUTHDOMAIN:${{ steps.env.outputs.project_id }}/${{ env.ENV }}AUTHDOMAIN
            STORAGEBUCKET:${{ steps.env.outputs.project_id }}/${{ env.ENV }}STORAGEBUCKET
            MESSAGINGSENDERID:${{ steps.env.outputs.project_id }}/${{ env.ENV }}MESSAGINGSENDERID
            APPID:${{ steps.env.outputs.project_id }}/${{ env.ENV }}APPID
            MEASUREMENTID:${{ steps.env.outputs.project_id }}/${{ env.ENV }}MEASUREMENTID
            NETWORK:${{ steps.env.outputs.project_id }}/${{ env.ENV }}NETWORK
            SUBNET:${{ steps.env.outputs.project_id }}/${{ env.ENV }}SUBNET
            REDIS:${{ steps.env.outputs.project_id }}/${{ env.ENV }}REDIS
            DB_INSTANCE_CONNECTION_NAME:${{ steps.env.outputs.project_id }}/${{ env.ENV }}DB_INSTANCE_CONNECTION_NAME
            RECAPTCHA_ENABLED:${{ steps.env.outputs.project_id }}/${{ env.ENV }}RECAPTCHA_ENABLED
            RECAPTCHA_SITE_KEY:${{ steps.env.outputs.project_id }}/${{ env.ENV }}RECAPTCHA_SITE_KEY
            RECAPTCHA_MIN_SCORE:${{ steps.env.outputs.project_id }}/${{ env.ENV }}RECAPTCHA_MIN_SCORE

      - name: Montar DATABASE_URL via socket do Cloud SQL
        run: |
          # Remove "@host" da credencial (fica user:pass) para conectar via socket,
          # que não depende do timing do Direct VPC Egress no cold start.
          CREDS="${DB_MYSQL_STRING%@*}"
          DBNAME="${projeto}_${ENV_DB}${BANCO_SUFFIX}"
          echo "DATABASE_URL_SOCKET=mysql://${CREDS}@localhost/${DBNAME}?socket=/cloudsql/${CONN}&connection_limit=${{ inputs.dbConnLimit }}" >> "$GITHUB_ENV"
        env:
          DB_MYSQL_STRING: ${{ steps.secret.outputs.DB_MYSQL_STRING }}
          CONN: ${{ steps.secret.outputs.DB_INSTANCE_CONNECTION_NAME }}
          projeto: ${{ inputs.projeto }}
          BANCO_SUFFIX: ${{ inputs.bancoSuffix }}

      - name: Write file yaml env
        uses: 'DamianReeves/write-file-action@master'
        with:
          path: ./env.yaml
          write-mode: overwrite
          contents: |
            DATABASE_URL: "${{ env.DATABASE_URL_SOCKET }}"
            DB_IDLE_TIMEOUT: "${{ inputs.dbIdleTimeout }}"
            DB_MIN_IDLE: "1"
            DOMAIN: "${{ steps.secret.outputs.DOMAIN }}/${{env.nomeDaFuncao}}"
            DOMAIN_FUNCTIONS: "${{ steps.secret.outputs.DOMAIN }}"
            FUNCTION: ${{env.nomeDaFuncao}}
            APIKEY: "${{ steps.secret.outputs.APIKEY }}"
            AUTHDOMAIN: "${{ steps.secret.outputs.AUTHDOMAIN }}"
            PROJECTID: "${{ steps.env.outputs.project_id }}"
            STORAGEBUCKET: "${{ steps.secret.outputs.STORAGEBUCKET }}"
            MESSAGINGSENDERID: "${{ steps.secret.outputs.MESSAGINGSENDERID }}"
            APPID: "${{ steps.secret.outputs.APPID }}"
            MEASUREMENTID: "${{ steps.secret.outputs.MEASUREMENTID }}"
            HTTP: https
            # Functions Framework: anexa o executionId da requisição a cada linha de
            # log (inclusive console.*) — com concurrency > 1, separa no Cloud
            # Logging as linhas de requisições intercaladas na mesma instância.
            LOG_EXECUTION_ID: "true"
            RECAPTCHA_ENABLED: "${{ steps.secret.outputs.RECAPTCHA_ENABLED }}"
            RECAPTCHA_SITE_KEY: "${{ steps.secret.outputs.RECAPTCHA_SITE_KEY }}"
            RECAPTCHA_MIN_SCORE: "${{ steps.secret.outputs.RECAPTCHA_MIN_SCORE }}"
            REDIS: |-
              ${{ steps.secret.outputs.REDIS }}

      - name: Anexar secrets extras ao env.yaml (opcional)
        if: inputs.extraSecrets != ''
        run: |
          # o write-file-action nao termina o arquivo com newline — sem isso o
          # append colaria na ultima linha e quebraria o YAML
          if [ -s env.yaml ] && [ -n "$(tail -c 1 env.yaml)" ]; then echo >> env.yaml; fi
          for NAME in ${{ inputs.extraSecrets }}; do
            VALUE=$(gcloud secrets versions access latest --secret="${ENV}${NAME}" --project=${{ steps.env.outputs.project_id }} 2>/dev/null || true)
            if [ -n "$VALUE" ]; then
              ESCAPED=$(printf '%s' "$VALUE" | sed 's/\\/\\\\/g; s/"/\\"/g')
              printf '%s: "%s"\n' "$NAME" "$ESCAPED" >> env.yaml
            else
              echo "::warning::Secret ${ENV}${NAME} nao encontrado no Secret Manager — variavel $NAME nao sera definida"
            fi
          done

      - name: Write file firebase account DEV
        if: github.ref_name == 'dev'
        uses: 'DamianReeves/write-file-action@master'
        with:
          path: ./firebase.json
          write-mode: overwrite
          contents: |
            ${{ secrets.FIREBASE_DEV }}

      - name: Write file firebase account QA
        if: github.ref_name == 'qa'
        uses: 'DamianReeves/write-file-action@master'
        with:
          path: ./firebase.json
          write-mode: overwrite
          contents: |
            ${{ secrets.FIREBASE_QA }}

      - name: Write file firebase account SANDBOX
        if: github.ref_name == 'sandbox'
        uses: 'DamianReeves/write-file-action@master'
        with:
          path: ./firebase.json
          write-mode: overwrite
          contents: |
            ${{ secrets.FIREBASE_SANDBOX }}

      - name: Write file firebase account PROD
        if: github.ref_name == 'main'
        uses: 'DamianReeves/write-file-action@master'
        with:
          path: ./firebase.json
          write-mode: overwrite
          contents: |
            ${{ secrets.FIREBASE }}

      - name: Replace placeholder no src/index.ts
        run: |
          # `-i.bak` funciona no GNU sed (ubuntu) e no BSD sed (macOS); o `-i`
          # sem sufixo quebra no Mac mini.
          sed -i.bak "s/google_nome_funcao_replace_pipiline/${{ env.nomeDaFuncao }}/g" src/index.ts
          rm -f src/index.ts.bak

      - name: Setup Node (prebuild)
        if: inputs.prebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No mini o ~/.npm já persiste em disco; o cache remoto só somaria
          # o tempo de restore/upload. No fallback (GitHub) ele liga.
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}

      - name: Build no runner e montar o pacote de deploy (prebuild)
        if: inputs.prebuild == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          rm -rf .deploy
          mkdir .deploy
          cp -R dist .deploy/dist
          cp package-lock.json firebase.json .deploy/
          # package.json do pacote:
          # - sem scripts: sem `build`/`gcp-build` o buildpack faz só a instalação
          #   de produção, e sem `postinstall` ele não depende de ferramenta de
          #   build na imagem;
          # - sem devDependencies + lock refeito só com produção: `--omit=dev`
          #   sozinho NÃO tira devDependency que também é peer opcional de uma
          #   dependência de produção (o lock marca como devOptional) — era o
          #   que mantinha a CLI do prisma e o typescript na imagem. O re-lock
          #   parte do lock do repo, então as versões resolvidas não mudam.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.scripts = {};
            delete pkg.devDependencies;
            fs.writeFileSync(".deploy/package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          (cd .deploy && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          # O npm 10 (Node 22) mantém no lock refeito os pacotes alcançados SÓ por
          # peer opcional (marcados optional + peer) e o `npm ci` do buildpack os
          # instala — a CLI do prisma voltava para a imagem por aí. O npm 11 já os
          # descarta; este filtro deixa o lock igual nas duas versões.
          node -e '
            const fs = require("fs");
            const file = ".deploy/package-lock.json";
            const lock = JSON.parse(fs.readFileSync(file, "utf8"));
            let removed = 0;
            for (const [name, entry] of Object.entries(lock.packages)) {
              if (entry.peer && entry.optional) {
                delete lock.packages[name];
                removed++;
              }
            }
            fs.writeFileSync(file, JSON.stringify(lock, null, 2) + "\n");
            console.log("lock de produção: " + (Object.keys(lock.packages).length - 1) + " pacotes (" + removed + " só de peer opcional removidos)");
          '
          echo "Pacote de deploy: $(du -sh .deploy | cut -f1) em $(find .deploy -type f | wc -l | tr -d ' ') arquivos"

      - name: 'Deploy na function'
        run: |
          EXTRA_FLAGS=""
          # Piso de 1 vCPU. O default do gen2 (0,5833) fazia o cold start
          # estourar o pluginTimeout do Fastify; a rejeicao virava
          # unhandledRejection, o functions-framework matava a instancia
          # (exit 16) e o browser via "erro de CORS" no lugar do 500 real.
          # Valores ACIMA de 1 informados pelo chamador sao preservados.
          CPU="${{ inputs.cpu }}"
          [ -z "$CPU" ] && CPU="1"
          CPU_CORES="${CPU%m}"
          case "$CPU" in
            *m) CPU_CORES=$(awk -v v="$CPU_CORES" 'BEGIN{printf "%.4f", v/1000}') ;;
          esac
          if awk -v v="$CPU_CORES" 'BEGIN{exit !(v < 1)}'; then
            echo "cpu=$CPU esta abaixo do piso de 1 vCPU; usando 1"
            CPU="1"
          fi
          EXTRA_FLAGS="$EXTRA_FLAGS --cpu=$CPU"
          if [ -n "${{ inputs.concurrency }}" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --concurrency=${{ inputs.concurrency }}"; fi
          # prebuild: sobe o pacote já compilado em vez do repositório
          if [ "${{ inputs.prebuild }}" = "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --source=.deploy"; fi
          gcloud functions deploy ${nomeDaFuncao} --gen2 --region=us-central1 --runtime nodejs22 --memory=1Gi --entry-point ${nomeDaFuncao} --trigger-http --allow-unauthenticated --env-vars-file env.yaml --project=${{ steps.env.outputs.project_id }} --min-instances=0 --max-instances=${{ inputs.maxInstances }} $EXTRA_FLAGS

      - name: "Aplicar x-internal-secret nos Cloud Scheduler jobs (opcional)"
        if: inputs.schedulerJobs != ''
        run: |
          SECRET=$(gcloud secrets versions access latest --secret="${ENV}INTERNAL_API_SECRET" --project=${{ steps.env.outputs.project_id }} 2>/dev/null || true)
          if [ -z "$SECRET" ]; then
            echo "::warning::Secret ${ENV}INTERNAL_API_SECRET nao encontrado — schedulers nao atualizados"
            exit 0
          fi
          for JOB in ${{ inputs.schedulerJobs }}; do
            if gcloud scheduler jobs describe "$JOB" --location=us-central1 --project=${{ steps.env.outputs.project_id }} >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$JOB" \
                --location=us-central1 \
                --project=${{ steps.env.outputs.project_id }} \
                --update-headers="x-internal-secret=${SECRET}" \
                --quiet
              echo "scheduler $JOB: header x-internal-secret aplicado"
            else
              echo "::warning::Cloud Scheduler job $JOB nao existe em ${{ steps.env.outputs.project_id }} — ignorado"
            fi
          done

      - name: 'Configurar Direct VPC Egress no Cloud Run subjacente'
        env:
          WANT_NET: ${{ steps.secret.outputs.NETWORK }}
          WANT_SUB: ${{ steps.secret.outputs.SUBNET }}
          WANT_SQL: ${{ steps.secret.outputs.DB_INSTANCE_CONNECTION_NAME }}
        run: |
          RUN_SERVICE=$(echo "${nomeDaFuncao}" | tr '_' '-')
          if [ "${{ inputs.vpcUpdate }}" = "if-needed" ]; then
            ann() {
              gcloud run services describe "${RUN_SERVICE}" --region=us-central1 \
                --project=${{ steps.env.outputs.project_id }} \
                --format="value(spec.template.metadata.annotations.\"run.googleapis.com/$1\")" 2>/dev/null || true
            }
            NET_IF=$(ann network-interfaces)
            CUR_NET=$(printf '%s' "$NET_IF" | sed -n 's/.*"network":"\([^"]*\)".*/\1/p')
            CUR_SUB=$(printf '%s' "$NET_IF" | sed -n 's/.*"subnetwork":"\([^"]*\)".*/\1/p')
            CUR_EGRESS=$(ann vpc-access-egress)
            CUR_SQL=$(ann cloudsql-instances)
            CUR_CONNECTOR=$(ann vpc-access-connector)
            # Compara pelo último segmento: o secret pode trazer o nome curto ou
            # o caminho completo (projects/.../networks/x). Qualquer diferença,
            # ou falha na leitura, cai no update (comportamento de sempre).
            SQL_OK=false
            case ",${CUR_SQL}," in *",${WANT_SQL},"*) SQL_OK=true ;; esac
            if [ -n "$CUR_NET" ] && [ "${CUR_NET##*/}" = "${WANT_NET##*/}" ] \
              && [ -n "$CUR_SUB" ] && [ "${CUR_SUB##*/}" = "${WANT_SUB##*/}" ] \
              && [ "$CUR_EGRESS" = "private-ranges-only" ] \
              && [ -z "$CUR_CONNECTOR" ] && [ "$SQL_OK" = "true" ]; then
              echo "Rede e Cloud SQL já estão configurados na revisão nova — update dispensado (sem 2ª revisão)."
              exit 0
            fi
            echo "Rede/Cloud SQL diferentes do desejado na revisão nova — aplicando o update."
          fi
          gcloud run services update "${RUN_SERVICE}" \
            --region=us-central1 \
            --project=${{ steps.env.outputs.project_id }} \
            --network=${{ steps.secret.outputs.NETWORK }} \
            --subnet=${{ steps.secret.outputs.SUBNET }} \
            --vpc-egress=private-ranges-only \
            --add-cloudsql-instances=${{ steps.secret.outputs.DB_INSTANCE_CONNECTION_NAME }} \
            --clear-vpc-connector

      - name: 'Limpando Artifact (mantém a imagem atual)'
        uses: actions/checkout@v4
        with:
          repository: my-build-ead/mybuilder-deploy
          path: .mybuilder-deploy
      - name: 'Limpar versões antigas'
        run: bash .mybuilder-deploy/scripts/cleanup-artifacts.sh ${{ steps.env.outputs.project_id }} ${{ env.nomeDaFuncao }} us-central1
      # Revisões do Cloud Run também acumulavam (só as imagens eram limpas):
      # mantém as 3 mais novas, nunca a que serve tráfego.
      - name: 'Limpar revisões antigas do Cloud Run (mantém 3)'
        run: bash .mybuilder-deploy/scripts/cleanup-revisions.sh ${{ steps.env.outputs.project_id }} ${{ env.nomeDaFuncao }} us-central1 3

      # O workspace do self-hosted persiste entre runs — não deixar env.yaml
      # (secrets do Secret Manager) nem firebase.json (service account) parados
      # em disco até o próximo checkout. (O gha-creds do google-github-actions/
      # auth o próprio action remove no post-step.)
      - name: Limpar arquivos sensíveis (self-hosted)
        if: always() && runner.os == 'macOS'
        run: rm -rf ./env.yaml ./firebase.json ./.deploy

      # O workspace deste projeto no Mac mini (_work/<repo>: checkout,
      # node_modules, dist, .mybuilder-deploy...) ficava em disco para sempre,
      # um por projeto e por instância do runner — era o que lotava o HD.
      # Apaga SÓ a pasta do próprio projeto (nunca _tool, _actions, _temp nem
      # os outros repos) e só quando este é o último job do repo:
      #   - nenhum outro job deste repo vivo nesta máquina (markers do passo
      #     "Registrar job ativo"; marker de job morto é descartado);
      #   - se o RUNNERS_READ_TOKEN tiver permissão "Actions: Read-only" nos
      #     repos, nenhum outro run do repo queued/pending/in_progress na API
      #     (dev, qa, sandbox e main disparados juntos: só o último limpa).
      #     Sem essa permissão a API responde 403 e vale só a checagem local,
      #     com aviso — nunca quebra o deploy.
      # Roda com always(): run que falhou também libera o disco.
      - name: Limpar _work do projeto no runner (self-hosted)
        if: always() && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_READ_TOKEN }}
        run: |
          # 1. este job deixa de contar como ativo
          if [ -n "${RUNNER_JOB_MARKER:-}" ]; then rm -f "$RUNNER_JOB_MARKER"; fi

          # 2. sanidade dos caminhos antes de qualquer rm: só _work/<repo>
          REPO="${GITHUB_REPOSITORY##*/}"
          case "$RUNNER_WORKSPACE" in
            */_work/"$REPO") ;;
            *) echo "::warning::RUNNER_WORKSPACE inesperado ($RUNNER_WORKSPACE) — limpeza do _work ignorada"; exit 0 ;;
          esac
          case "$GITHUB_WORKSPACE" in
            "$RUNNER_WORKSPACE"/*) ;;
            *) echo "::warning::GITHUB_WORKSPACE ($GITHUB_WORKSPACE) fora de $RUNNER_WORKSPACE — limpeza do _work ignorada"; exit 0 ;;
          esac

          # 3. outro job deste repo vivo nesta máquina (qualquer instância)?
          DIR="${HOME}/.actions-runner-jobs/$(printf '%s' "$GITHUB_REPOSITORY" | tr / _)"
          LIVE=0
          for M in "$DIR"/*; do
            [ -f "$M" ] || continue
            PID=$(sed -n 's/^pid=//p' "$M")
            RUNNER=$(sed -n 's/^runner=//p' "$M")
            if [ "$RUNNER" = "$RUNNER_NAME" ]; then
              # esta instância roda um job por vez: é resto de job interrompido
              rm -f "$M"
            elif [ -n "$PID" ] && ps -o command= -p "$PID" 2>/dev/null | grep -q 'Runner.Worker'; then
              echo "Job ativo deste repo: $(basename "$M") (runner $RUNNER, pid $PID)"
              LIVE=$((LIVE + 1))
            else
              rm -f "$M"  # job que não encerrou direito (reboot/kill)
            fi
          done
          if [ "$LIVE" -gt 0 ]; then
            echo "$LIVE outro(s) job(s) de $GITHUB_REPOSITORY rodando nesta máquina — a limpeza fica para o último."
            exit 0
          fi

          # 4. outro run deste repo na fila/em andamento (dev, qa, sandbox, main)?
          if [ -n "${GH_TOKEN:-}" ]; then
            OTHERS=0
            API_OK=true
            for ST in queued pending in_progress; do
              BODY=$(curl -sS -m 20 -w '\n%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/actions/runs?status=$ST&per_page=1") || { API_OK=false; break; }
              CODE=$(printf '%s' "$BODY" | tail -n 1)
              if [ "$CODE" != "200" ]; then echo "HTTP $CODE ao listar runs ($ST)"; API_OK=false; break; fi
              N=$(printf '%s' "$BODY" | sed -n 's/.*"total_count": *\([0-9][0-9]*\).*/\1/p' | head -n 1)
              if [ -z "$N" ]; then API_OK=false; break; fi
              if [ "$ST" = "in_progress" ]; then N=$((N - 1)); fi  # desconta este run
              if [ "$N" -gt 0 ]; then OTHERS=$((OTHERS + N)); fi
            done
            if [ "$API_OK" = "false" ]; then
              echo "::warning::Sem leitura dos runs de $GITHUB_REPOSITORY (o RUNNERS_READ_TOKEN precisa de 'Actions: Read-only' nos repos) — considerando só os jobs desta máquina."
            elif [ "$OTHERS" -gt 0 ]; then
              echo "$OTHERS outro(s) run(s) de $GITHUB_REPOSITORY na fila/em andamento — a limpeza fica para o último."
              exit 0
            fi
          else
            echo "RUNNERS_READ_TOKEN ausente — considerando só os jobs desta máquina."
          fi

          # 5. último job do repo: apaga _work/<repo> e recria o workspace vazio
          #    (o runner e o checkout esperam a pasta no próximo run)
          SIZE=$(du -sh "$RUNNER_WORKSPACE" 2>/dev/null | cut -f1)
          cd "${RUNNER_TEMP:-/tmp}"
          rm -rf "$RUNNER_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          echo "Apagado $RUNNER_WORKSPACE (${SIZE:-?} liberados)."
